# 禽康智检APP Nginx配置

# 用户配置
user www-data;
worker_processes auto;
pid /run/nginx.pid;
include /etc/nginx/modules-enabled/*.conf;

# 事件配置
events {
    worker_connections 1024;
    multi_accept on;
    use epoll;
}

# HTTP配置
http {
    # 基本设置
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志配置
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip压缩配置
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types 
        text/plain 
        text/css 
        text/xml 
        text/javascript 
        application/json 
        application/javascript 
        application/xml+rss 
        application/atom+xml 
        image/svg+xml;

    # 代理设置
    proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=api_cache:10m max_size=100m inactive=60m use_temp_path=off;
    proxy_cache_key "$scheme$request_method$host$request_uri";

    # 服务器配置
    server {
        # 监听HTTP端口
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        # HTTP到HTTPS重定向
        return 301 https://$host$request_uri;
    }

    # 前端应用服务器
    server {
        # 监听HTTPS端口
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        # 域名配置
        server_name your-domain.com;

        # SSL证书配置
        ssl_certificate /etc/nginx/ssl/your-domain.com.crt;
        ssl_certificate_key /etc/nginx/ssl/your-domain.com.key;

        # SSL优化配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # 根目录
        root /var/www/html;
        index index.html index.htm;

        # 前端静态资源配置
        location / {
            try_files $uri $uri/ /index.html;

            # 缓存策略
            expires 1h;
            add_header Cache-Control "public, no-cache";
        }

        # 静态资源缓存配置
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            access_log off;
        }

        # API代理配置
        location /api {
            # 代理到后端服务
            proxy_pass http://localhost:3000;

            # 代理设置
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # API缓存配置
            proxy_cache api_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_valid 404 1m;
            proxy_cache_methods GET HEAD;
            add_header X-Cache-Status $upstream_cache_status;

            # API超时设置
            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
        }

        # 健康检查端点
        location /health {
            proxy_pass http://localhost:3000/api/health;
            access_log off;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }

    # API服务器（可选，用于分离配置）
    server {
        # 监听HTTPS端口
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        # API域名配置
        server_name api.your-domain.com;

        # SSL证书配置
        ssl_certificate /etc/nginx/ssl/api.your-domain.com.crt;
        ssl_certificate_key /etc/nginx/ssl/api.your-domain.com.key;

        # SSL优化配置
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers 'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305';
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # API代理配置
        location / {
            # 代理到后端服务
            proxy_pass http://localhost:3000;

            # 代理设置
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # API缓存配置
            proxy_cache api_cache;
            proxy_cache_valid 200 5m;
            proxy_cache_valid 404 1m;
            proxy_cache_methods GET HEAD;
            add_header X-Cache-Status $upstream_cache_status;

            # API超时设置
            proxy_connect_timeout 10s;
            proxy_send_timeout 10s;
            proxy_read_timeout 30s;
        }

        # 健康检查端点
        location /health {
            proxy_pass http://localhost:3000/api/health;
            access_log off;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }
    }
}

name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  frontend-lint:
    name: Frontend Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Run ESLint
        run: npm run lint
      - name: Run Prettier check
        run: npm run format:check
      - name: Run TypeScript check
        run: npm run typecheck

  backend-lint:
    name: Backend Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm install
        working-directory: ./backend
      - name: Run ESLint
        run: npm run lint
        working-directory: ./backend
      - name: Run Prettier check
        run: npm run format:check
        working-directory: ./backend

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install backend dependencies
        run: npm install
        working-directory: ./backend
      - name: Run backend tests
        run: npm test
        working-directory: ./backend

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [ frontend-lint, backend-lint, test ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm install
      - name: Build frontend
        run: npm run build:web
      - name: Install backend dependencies
        run: npm install
        working-directory: ./backend
      - name: Build backend
        run: echo "Backend build completed" # Backend is Node.js app, no build step needed

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    # TODO: 补充实际部署命令（如 SSH 部署、EAS Build 等）
    # 当前占位步骤，确保 pipeline 可运行
    steps:
      - name: Deploy placeholder
        run: echo "Deploy step TODO — configure SSH deploy or EAS Build commands"

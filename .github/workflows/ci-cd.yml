name: CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  # ========== 代码质量检查 ==========
  frontend-lint:
    name: Frontend Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm install
      - name: Run ESLint
        run: npm run lint
      - name: Run Prettier check
        run: npm run format:check
      - name: Run TypeScript check
        run: npm run typecheck

  backend-lint:
    name: Backend Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm install
        working-directory: ./backend
      - name: Run ESLint
        run: npm run lint
        working-directory: ./backend
      - name: Run Prettier check
        run: npm run format:check
        working-directory: ./backend

  # ========== 后端单元测试 ==========
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 3
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm install
        working-directory: ./backend
      - name: Run backend tests
        run: npm test
        working-directory: ./backend
        env:
          MONGODB_URI: mongodb://localhost:27017/qinkangzhijian_test
          JWT_SECRET: test_jwt_secret_for_ci_only
          NODE_ENV: test

  # ========== 构建 ==========
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [ frontend-lint, backend-lint, backend-test ]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install frontend dependencies
        run: npm install
      - name: TypeScript type check
        run: npm run typecheck
      - name: Install backend dependencies
        run: npm install
        working-directory: ./backend

  # ========== EAS Build（前端 APK）==========
  eas-build:
    name: EAS Build (Android APK)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install EAS CLI
        run: npm install -g eas-cli
      - name: Install frontend dependencies
        run: npm install
      - name: Build Android APK (preview)
        run: eas build --platform android --profile preview --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

  # ========== 后端部署 ==========
  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_BACKEND_PATH }}
            git pull origin main
            npm install --production
            pm2 restart qinkangzhijian-api || pm2 start index.js --name qinkangzhijian-api
      - name: Health check
        run: |
          for i in $(seq 1 10); do
            if curl -sf https://${{ secrets.DEPLOY_HOST }}/api/health | grep -q "ok"; then
              echo "Health check passed"
              exit 0
            fi
            echo "Waiting for server... ($i/10)"
            sleep 5
          done
          echo "Health check failed"
          exit 1

  # ========== 前端部署（Web）==========
  deploy-frontend:
    name: Deploy Frontend (Web)
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install
      - name: Build web
        run: npx expo export:web
      - name: Deploy to hosting
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web-build
          publish_branch: gh-pages

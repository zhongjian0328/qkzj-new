    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 页面元素
            const caseListView = document.querySelector('#case-list-view');
            const annotationView = document.querySelector('#annotation-view');
            const caseItems = document.querySelectorAll('.case-item');
            const backToListBtn = document.querySelector('#back-to-list');
            const backBtn = document.querySelector('#back-btn');
            const researchCollabBtn = document.querySelector('#research-collab-btn');
            const profileBtn = document.querySelector('#profile-btn');
            const downloadBtn = document.querySelector('#download-original');
            const saveBtn = document.querySelector('#save-annotation');
            const annotationTools = document.querySelectorAll('.annotation-tool');
            const colorBtns = document.querySelectorAll('.color-btn');
            const clearBtn = document.querySelector('#clear-annotations');
            const loadingOverlay = document.querySelector('#loading-overlay');

            // 标注工具状态
            let currentTool = 'brush';
            let currentColor = '#ef4444';
            let isDrawing = false;
            let annotations = [];

            // 返回按钮
            backBtn.addEventListener('click', function() {
                console.log('返回上一页');
                // 在实际应用中，这里会返回到上一页
            });

            // 科研协作按钮
            researchCollabBtn.addEventListener('click', function() {
                window.location.href = 'P-RESEARCH_COLLAB.html';
            });

            // 个人中心按钮
            profileBtn.addEventListener('click', function() {
                window.location.href = 'P-USER_PROFILE.html';
            });

            // 病例列表点击事件
            caseItems.forEach(item => {
                item.addEventListener('click', function() {
                    const caseId = this.dataset.caseId;
                    showAnnotationView(caseId);
                });
            });

            // 返回列表
            backToListBtn.addEventListener('click', function() {
                showCaseListView();
            });

            // 显示病例列表视图
            function showCaseListView() {
                caseListView.classList.remove('hidden');
                annotationView.classList.add('hidden');
                document.querySelector('#page-title').textContent = '数据标注';
            }

            // 显示标注视图
            function showAnnotationView(caseId) {
                caseListView.classList.add('hidden');
                annotationView.classList.remove('hidden');
                document.querySelector('#page-title').textContent = '病例标注';
                
                // 加载病例数据
                loadCaseData(caseId);
                // 初始化画布
                initCanvas();
            }

            // 加载病例数据
            function loadCaseData(caseId) {
                const caseData = {
                    'case1': {
                        name: '新城疫疑似病例',
                        aiResult: 'AI诊断：新城疫 (95%)',
                        date: '2024-01-15',
                        image: 'https://s.coze.cn/image/o-Wx0v-Fk5A/'
                    },
                    'case2': {
                        name: '禽流感确诊病例',
                        aiResult: 'AI诊断：禽流感 (88%)',
                        date: '2024-01-14',
                        image: 'https://s.coze.cn/image/Fs4fmM7CHfo/'
                    },
                    'case3': {
                        name: '传染性支气管炎',
                        aiResult: 'AI诊断：传染性支气管炎 (92%)',
                        date: '2024-01-13',
                        image: 'https://s.coze.cn/image/zRHvd0dXzdo/'
                    },
                    'case4': {
                        name: '混合感染病例',
                        aiResult: 'AI诊断：新城疫+禽流感 (85%)',
                        date: '2024-01-12',
                        image: 'https://s.coze.cn/image/bkZKUZXldSg/'
                    }
                };

                const data = caseData[caseId];
                if (data) {
                    document.querySelector('#case-disease-name').textContent = data.name;
                    document.querySelector('#case-ai-result').textContent = data.aiResult;
                    document.querySelector('#case-date').textContent = data.date;
                    document.querySelector('#case-image-large').src = data.image;
                    document.querySelector('#case-image-large').alt = data.name;
                    document.querySelector('#annotation-image').src = data.image;
                    document.querySelector('#annotation-image').alt = data.name;
                }
            }

            // 初始化画布
            function initCanvas() {
                const canvas = document.querySelector('#annotation-canvas');
                const ctx = canvas.getContext('2d');
                const image = document.querySelector('#annotation-image');

                // 设置画布尺寸
                function resizeCanvas() {
                    const container = canvas.parentElement;
                    canvas.width = container.offsetWidth;
                    canvas.height = container.offsetHeight;
                    drawAnnotations();
                }

                window.addEventListener('resize', resizeCanvas);
                resizeCanvas();

                // 画布事件
                canvas.addEventListener('mousedown', startDrawing);
                canvas.addEventListener('mousemove', draw);
                canvas.addEventListener('mouseup', stopDrawing);
                canvas.addEventListener('mouseout', stopDrawing);

                canvas.addEventListener('touchstart', handleTouch);
                canvas.addEventListener('touchmove', handleTouch);
                canvas.addEventListener('touchend', handleTouch);

                function startDrawing(e) {
                    isDrawing = true;
                    ctx.beginPath();
                    const rect = canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    ctx.moveTo(x, y);
                }

                function draw(e) {
                    if (!isDrawing) return;
                    
                    const rect = canvas.getBoundingClientRect();
                    const x = e.clientX - rect.left;
                    const y = e.clientY - rect.top;
                    
                    ctx.lineTo(x, y);
                    ctx.strokeStyle = currentColor;
                    ctx.lineWidth = 3;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }

                function stopDrawing() {
                    if (!isDrawing) return;
                    isDrawing = false;
                    ctx.closePath();
                    // 保存标注
                    saveCurrentAnnotation();
                }

                function handleTouch(e) {
                    e.preventDefault();
                    const touch = e.touches[0];
                    const mouseEvent = new MouseEvent(e.type === 'touchstart' ? 'mousedown' : 
                                                     e.type === 'touchmove' ? 'mousemove' : 'mouseup', {
                        clientX: touch.clientX,
                        clientY: touch.clientY
                    });
                    canvas.dispatchEvent(mouseEvent);
                }

                function drawAnnotations() {
                    // 重绘所有标注
                    annotations.forEach(annotation => {
                        ctx.strokeStyle = annotation.color;
                        ctx.lineWidth = 3;
                        ctx.lineCap = 'round';
                        ctx.beginPath();
                        ctx.moveTo(annotation.points[0].x, annotation.points[0].y);
                        annotation.points.slice(1).forEach(point => {
                            ctx.lineTo(point.x, point.y);
                        });
                        ctx.stroke();
                    });
                }

                function saveCurrentAnnotation() {
                    // 这里应该保存当前的标注路径
                    console.log('保存标注');
                }
            }

            // 标注工具切换
            annotationTools.forEach(tool => {
                tool.addEventListener('click', function() {
                    annotationTools.forEach(t => {
                        t.classList.remove('bg-secondary', 'text-white');
                        t.classList.add('bg-gray-100', 'text-gray-600');
                    });
                    this.classList.remove('bg-gray-100', 'text-gray-600');
                    this.classList.add('bg-secondary', 'text-white');
                    
                    currentTool = this.id.replace('tool-', '');
                    console.log('切换工具:', currentTool);
                });
            });

            // 颜色选择
            colorBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    colorBtns.forEach(b => b.classList.remove('border-secondary'));
                    this.classList.add('border-secondary');
                    currentColor = this.dataset.color;
                    console.log('选择颜色:', currentColor);
                });
            });

            // 清除标注
            clearBtn.addEventListener('click', function() {
                if (confirm('确定要清除所有标注吗？')) {
                    const canvas = document.querySelector('#annotation-canvas');
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    annotations = [];
                    console.log('清除所有标注');
                }
            });

            // 病例采集功能
            function setupCaseCollection() {
                const collectBtns = document.querySelectorAll('.collect-btn');
                let collectedCases = JSON.parse(localStorage.getItem('collectedCases') || '[]');
                
                // 更新采集按钮状态
                function updateCollectBtnState() {
                    collectBtns.forEach(btn => {
                        const caseId = btn.dataset.caseId;
                        if (collectedCases.includes(caseId)) {
                            btn.classList.remove('bg-secondary', 'text-white');
                            btn.classList.add('bg-gray-100', 'text-gray-600');
                            btn.innerHTML = '<i class="fas fa-star mr-1"></i>已采集';
                            btn.disabled = true;
                        } else {
                            btn.classList.add('bg-secondary', 'text-white');
                            btn.classList.remove('bg-gray-100', 'text-gray-600');
                            btn.innerHTML = '<i class="fas fa-star mr-1"></i>采集';
                            btn.disabled = false;
                        }
                    });
                }
                
                // 初始化采集按钮状态
                updateCollectBtnState();
                
                // 采集按钮点击事件
                collectBtns.forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation(); // 阻止事件冒泡，避免触发病例详情
                        
                        const caseId = this.dataset.caseId;
                        if (!collectedCases.includes(caseId)) {
                            showLoading();
                            setTimeout(() => {
                                hideLoading();
                                collectedCases.push(caseId);
                                localStorage.setItem('collectedCases', JSON.stringify(collectedCases));
                                updateCollectBtnState();
                                alert('病例已采集');
                                console.log('采集病例:', caseId);
                            }, 1000);
                        }
                    });
                });
            }
            
            // 调用病例采集功能
            setupCaseCollection();
            
            // 下载高清原图
            downloadBtn.addEventListener('click', function() {
                showLoading();
                setTimeout(() => {
                    hideLoading();
                    alert('高清原图已下载');
                    console.log('下载高清原图');
                }, 1000);
            });

            // 保存标注
            saveBtn.addEventListener('click', function() {
                showLoading();
                setTimeout(() => {
                    hideLoading();
                    alert('标注已保存');
                    console.log('保存标注');
                    
                    // 更新病例状态为已标注
                    const currentCaseId = document.querySelector('.case-item.active')?.dataset.caseId;
                    if (currentCaseId) {
                        const caseItem = document.querySelector(`[data-case-id="${currentCaseId}"]`);
                        const statusSpan = caseItem.querySelector('span[class*="bg-orange-100"]');
                        if (statusSpan) {
                            statusSpan.className = 'px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs';
                            statusSpan.textContent = '已标注';
                        }
                    }
                }, 1500);
            });

            // 筛选功能
            document.querySelector('#filter-all').addEventListener('click', function() {
                setActiveFilter(this);
                showAllCases();
            });

            document.querySelector('#filter-unannotated').addEventListener('click', function() {
                setActiveFilter(this);
                filterCases('待标注');
            });

            document.querySelector('#filter-annotated').addEventListener('click', function() {
                setActiveFilter(this);
                filterCases('已标注');
            });

            function setActiveFilter(button) {
                document.querySelectorAll('[id^="filter-"]').forEach(btn => {
                    btn.classList.remove('bg-secondary', 'text-white');
                    btn.classList.add('bg-gray-100', 'text-gray-600');
                });
                button.classList.remove('bg-gray-100', 'text-gray-600');
                button.classList.add('bg-secondary', 'text-white');
            }

            function showAllCases() {
                caseItems.forEach(item => item.style.display = 'block');
            }

            function filterCases(status) {
                caseItems.forEach(item => {
                    const statusSpan = item.querySelector('span[class*="rounded-full"]');
                    if (statusSpan && statusSpan.textContent === status) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
            }

            // 搜索功能
            document.querySelector('#search-input').addEventListener('input', function() {
                const searchTerm = this.value.toLowerCase();
                caseItems.forEach(item => {
                    const diseaseName = item.querySelector('h4').textContent.toLowerCase();
                    const aiResult = item.querySelector('p').textContent.toLowerCase();
                    if (diseaseName.includes(searchTerm) || aiResult.includes(searchTerm)) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
            });

            // 显示加载状态
            function showLoading() {
                loadingOverlay.classList.remove('hidden');
            }

            // 隐藏加载状态
            function hideLoading() {
                loadingOverlay.classList.add('hidden');
            }

            // 缩放功能
            document.querySelector('#zoom-in').addEventListener('click', function() {
                console.log('放大图片');
            });

            document.querySelector('#zoom-out').addEventListener('click', function() {
                console.log('缩小图片');
            });

            document.querySelector('#zoom-reset').addEventListener('click', function() {
                console.log('重置缩放');
            });
        });
    </script>
</body>
</html>

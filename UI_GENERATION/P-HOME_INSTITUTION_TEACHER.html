<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禽康智检 - 教师首页</title>
    <script src="https://unpkg.byted-static.com/coze/space_ppt_lib/1.0.3-alpha.12/lib/tailwindcss.js"></script>
    <script src="https://unpkg.byted-static.com/fortawesome/fontawesome-free/6.7.2/js/all.min.js" data-auto-replace-svg="nest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                primary: '#E6F7F3',
                secondary: '#2DBBA1',
                accent: '#1F5E52',
                'text-primary': '#111827',
                'text-secondary': '#4B5563',
                'text-tertiary': '#9CA3AF',
                'bg-light': '#F3F4F6',
                'card-bg': '#FFFFFF',
                'border-color': '#E5E7EB',
                'success': '#10B981',
                'warning': '#F59E0B',
                'error': '#EF4444',
                'info': '#3B82F6'
            },
            
            
                    fontFamily: {
                        'sans': ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
                    },
                    boxShadow: {
                        'card': '0 2px 8px rgba(0, 0, 0, 0.06)',
                        'button': '0 2px 4px rgba(59, 204, 165, 0.2)'
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #E6F7F3 0%, #2DBBA1 100%);
        }
        
        .card-hover:active {
            transform: scale(0.98);
            transition: transform 0.1s ease;
        }
        
        .safe-top {
            padding-top: env(safe-area-inset-top);
        }
        
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .status-bar {
            background: linear-gradient(135deg, #E6F7F3 0%, #2DBBA1 100%);
        }
    </style>
</head>
<body class="bg-bg-light font-sans">
    <!-- 状态栏 -->
    <div id="status-bar" class="status-bar safe-top">
        <div class="flex justify-between items-center px-4 py-2 text-sm font-medium text-accent">
            <span>9:41</span>
            <div class="flex items-center space-x-1">
                <i class="fas fa-signal text-xs"></i>
                <i class="fas fa-wifi text-xs"></i>
                <i class="fas fa-battery-three-quarters text-xs"></i>
            </div>
        </div>
    </div>

    <!-- 顶部导航栏 -->
    <header id="top-header" class="bg-white shadow-sm">
        <div class="flex justify-between items-center px-4 py-3">
            <div class="flex items-center space-x-3">
                <h1 id="page-title" class="text-lg font-semibold text-text-primary">教师首页</h1>
            </div>
            <div id="header-actions" class="flex items-center space-x-3">
                <button id="notification-btn" class="relative p-2">
                    <i class="far fa-bell text-xl text-text-secondary"></i>
                    <span class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full"></span>
                </button>
                <button id="profile-btn">
                    <i class="fas fa-user-circle text-xl text-text-secondary"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要内容区域 -->
    <main id="main-content" class="px-4 py-6">
        <!-- 数据概览 -->
        <section id="overview-section" class="grid grid-cols-3 gap-4 mb-6">
            <div id="report-count" class="bg-card-bg rounded-xl p-4 shadow-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-text-secondary">待批改报告</p>
                        <h3 class="text-2xl font-bold text-text-primary mt-1">12</h3>
                    </div>
                    <div class="w-12 h-12 bg-secondary/10 rounded-full flex items-center justify-center">
                        <i class="fas fa-file-alt text-xl text-secondary"></i>
                    </div>
                </div>
            </div>
            
            <div id="student-count" class="bg-card-bg rounded-xl p-4 shadow-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-text-secondary">活跃学生</p>
                        <h3 class="text-2xl font-bold text-text-primary mt-1">45</h3>
                    </div>
                    <div class="w-12 h-12 bg-secondary/10 rounded-full flex items-center justify-center">
                        <i class="fas fa-users text-xl text-secondary"></i>
                    </div>
                </div>
            </div>
            
            <div id="group-count" class="bg-card-bg rounded-xl p-4 shadow-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-text-secondary">实习组数</p>
                        <h3 class="text-2xl font-bold text-text-primary mt-1">5</h3>
                    </div>
                    <div class="w-12 h-12 bg-secondary/10 rounded-full flex items-center justify-center">
                        <i class="fas fa-users-cog text-xl text-secondary"></i>
                    </div>
                </div>
            </div>
        </section>

        <!-- 核心功能区 -->
        <section id="core-functions" class="space-y-4 mb-6">
            <div class="flex space-x-4">
                <button id="internship-management-btn" class="flex-1 gradient-bg rounded-xl p-4 shadow-card flex items-center justify-center space-x-3 card-hover">
                    <div class="w-12 h-12 bg-white/30 rounded-full flex items-center justify-center">
                        <i class="fas fa-calendar-alt text-accent"></i>
                    </div>
                    <div class="text-left">
                        <h3 class="font-semibold text-accent">实习管理</h3>
                        <p class="text-sm text-accent/80">管理实习任务和进度</p>
                    </div>
                </button>
                
                <button id="student-guidance-btn" class="flex-1 gradient-bg rounded-xl p-4 shadow-card flex items-center justify-center space-x-3 card-hover">
                    <div class="w-12 h-12 bg-white/30 rounded-full flex items-center justify-center">
                        <i class="fas fa-user-graduate text-accent"></i>
                    </div>
                    <div class="text-left">
                        <h3 class="font-semibold text-accent">学生指导</h3>
                        <p class="text-sm text-accent/80">查看学生列表和状态</p>
                    </div>
                </button>
            </div>
            
            <button id="report-correction-btn" class="w-full gradient-bg rounded-xl p-4 shadow-card flex items-center justify-center space-x-3 card-hover">
                <div class="w-12 h-12 bg-white/30 rounded-full flex items-center justify-center">
                    <i class="fas fa-pen-to-square text-accent"></i>
                </div>
                <div class="text-left">
                    <h3 class="font-semibold text-accent">报告批改</h3>
                    <p class="text-sm text-accent/80">批改学生实习报告</p>
                </div>
            </button>
        </section>

        <!-- 待办事项 -->
        <section id="todo-section" class="bg-card-bg rounded-xl p-4 shadow-card mb-6">
            <h2 class="text-lg font-semibold text-text-primary mb-4">待办事项</h2>
            
            <div id="todo-list" class="space-y-3">
                <div class="flex items-start space-x-3">
                    <div class="mt-1">
                        <input type="checkbox" id="todo-1" class="w-4 h-4 text-secondary rounded">
                    </div>
                    <div class="flex-1">
                        <label for="todo-1" class="text-sm text-text-primary">批改张三的实习报告</label>
                        <p class="text-xs text-text-secondary mt-1">截止日期：明天</p>
                    </div>
                </div>
                
                <div class="flex items-start space-x-3">
                    <div class="mt-1">
                        <input type="checkbox" id="todo-2" class="w-4 h-4 text-secondary rounded">
                    </div>
                    <div class="flex-1">
                        <label for="todo-2" class="text-sm text-text-primary">审核李四的实习计划</label>
                        <p class="text-xs text-text-secondary mt-1">截止日期：后天</p>
                    </div>
                </div>
                
                <div class="flex items-start space-x-3">
                    <div class="mt-1">
                        <input type="checkbox" id="todo-3" class="w-4 h-4 text-secondary rounded">
                    </div>
                    <div class="flex-1">
                        <label for="todo-3" class="text-sm text-text-primary">召开实习小组会议</label>
                        <p class="text-xs text-text-secondary mt-1">时间：明天 14:00</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 最近活动 -->
        <section id="recent-activities" class="bg-card-bg rounded-xl p-4 shadow-card">
            <h2 class="text-lg font-semibold text-text-primary mb-4">最近活动</h2>
            
            <div id="activities-list" class="space-y-4">
                <div class="flex items-start space-x-3">
                    <div class="w-8 h-8 bg-secondary/10 rounded-full flex items-center justify-center mt-1">
                        <i class="fas fa-user-graduate text-sm text-secondary"></i>
                    </div>
                    <div class="flex-1">
                        <p class="text-sm text-text-primary">王五提交了实习日志</p>
                        <p class="text-xs text-text-secondary mt-1">2小时前</p>
                    </div>
                </div>
                
                <div class="flex items-start space-x-3">
                    <div class="w-8 h-8 bg-secondary/10 rounded-full flex items-center justify-center mt-1">
                        <i class="fas fa-file-alt text-sm text-secondary"></i>
                    </div>
                    <div class="flex-1">
                        <p class="text-sm text-text-primary">赵六提交了实习报告</p>
                        <p class="text-xs text-text-secondary mt-1">5小时前</p>
                    </div>
                </div>
                
                <div class="flex items-start space-x-3">
                    <div class="w-8 h-8 bg-secondary/10 rounded-full flex items-center justify-center mt-1">
                        <i class="fas fa-users text-sm text-secondary"></i>
                    </div>
                    <div class="flex-1">
                        <p class="text-sm text-text-primary">第七小组完成了实习任务</p>
                        <p class="text-xs text-text-secondary mt-1">昨天</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 底部导航栏 -->
    <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-white shadow-md safe-bottom z-50">
        <div class="flex justify-around items-center h-16">
            <button id="nav-home" class="flex flex-col items-center justify-center px-4 py-2">
                <i class="fas fa-home text-secondary text-xl"></i>
                <span class="text-xs text-text-primary mt-1">首页</span>
            </button>
            <button id="nav-internship" class="flex flex-col items-center justify-center px-4 py-2">
                <i class="fas fa-calendar-alt text-text-secondary text-xl"></i>
                <span class="text-xs text-text-primary mt-1">实习管理</span>
            </button>
            <button id="nav-profile" class="flex flex-col items-center justify-center px-4 py-2">
                <i class="fas fa-user-circle text-text-secondary text-xl"></i>
                <span class="text-xs text-text-primary mt-1">我的</span>
            </button>
        </div>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 个人中心按钮
            document.querySelector('#profile-btn').addEventListener('click', function() {
                window.location.href = 'P-USER_PROFILE.html';
            });
            
            // 实习管理按钮
            document.querySelector('#internship-management-btn').addEventListener('click', function() {
                window.location.href = 'P-MENTOR_DASHBOARD.html';
            });
            
            // 学生指导按钮
            document.querySelector('#student-guidance-btn').addEventListener('click', function() {
                window.location.href = 'P-MENTOR_DASHBOARD.html';
            });
            
            // 报告批改按钮
            document.querySelector('#report-correction-btn').addEventListener('click', function() {
                window.location.href = 'P-MENTOR_DASHBOARD.html';
            });
            
            // 底部导航栏
            document.querySelector('#nav-home').addEventListener('click', function() {
                window.location.href = 'P-HOME_INSTITUTION_TEACHER.html';
            });
            
            document.querySelector('#nav-internship').addEventListener('click', function() {
                window.location.href = 'P-MENTOR_DASHBOARD.html';
            });
            
            document.querySelector('#nav-profile').addEventListener('click', function() {
                window.location.href = 'P-USER_PROFILE.html';
            });
        });
    </script>
</body>
</html>

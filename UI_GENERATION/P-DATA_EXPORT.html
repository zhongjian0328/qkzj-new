<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禽康智检 - 数据导出</title>
    <script src="https://unpkg.byted-static.com/coze/space_ppt_lib/1.0.3-alpha.12/lib/tailwindcss.js"></script>
    <script src="https://unpkg.byted-static.com/fortawesome/fontawesome-free/6.7.2/js/all.min.js" data-auto-replace-svg="nest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                primary: '#E6F7F3',
                secondary: '#2DBBA1',
                accent: '#1F5E52',
                'text-primary': '#111827',
                'text-secondary': '#4B5563',
                'text-tertiary': '#9CA3AF',
                'bg-light': '#F3F4F6',
                'card-bg': '#FFFFFF',
                'border-color': '#E5E7EB',
                'success': '#10B981',
                'warning': '#F59E0B',
                'error': '#EF4444',
                'info': '#3B82F6'
            },
            
            
                    fontFamily: {
                        'sans': ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
                    },
                    boxShadow: {
                        'card': '0 2px 8px rgba(0, 0, 0, 0.06)',
                        'button': '0 2px 4px rgba(59, 204, 165, 0.2)'
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #E6F7F3 0%, #2DBBA1 100%);
        }
        
        .card-hover:active {
            transform: scale(0.98);
            transition: transform 0.1s ease;
        }
        
        .safe-top {
            padding-top: env(safe-area-inset-top);
        }
        
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .status-bar {
            background: linear-gradient(135deg, #E6F7F3 0%, #2DBBA1 100%);
        }
    </style>
</head>
<body class="bg-bg-light font-sans">
    <!-- 状态栏 -->
    <div id="status-bar" class="status-bar safe-top">
        <div class="flex justify-between items-center px-4 py-2 text-sm font-medium text-accent">
            <span>9:41</span>
            <div class="flex items-center space-x-1">
                <i class="fas fa-signal text-xs"></i>
                <i class="fas fa-wifi text-xs"></i>
                <i class="fas fa-battery-three-quarters text-xs"></i>
            </div>
        </div>
    </div>

    <!-- 顶部导航栏 -->
    <header id="top-header" class="bg-white shadow-sm">
        <div class="flex justify-between items-center px-4 py-3">
            <button id="back-btn" class="flex items-center">
                <i class="fas fa-arrow-left text-text-secondary text-xl"></i>
            </button>
            <h1 id="page-title" class="text-lg font-semibold text-text-primary">数据导出</h1>
            <div class="w-6"></div>
        </div>
    </header>

    <!-- 主要内容区域 -->
    <main id="main-content" class="px-4 py-6 pb-20">
        <!-- 导出类型选择 -->
        <section id="export-type" class="mb-8">
            <h2 id="export-type-title" class="text-lg font-semibold text-text-primary mb-4">选择导出类型</h2>
            
            <div id="export-type-grid" class="grid grid-cols-2 gap-4">
                <div id="production-data-card" class="bg-card-bg rounded-xl p-4 shadow-card card-hover">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-secondary/10 rounded-full flex items-center justify-center">
                            <i class="fas fa-chart-line text-xl text-secondary"></i>
                        </div>
                        <div>
                            <h4 class="font-semibold text-text-primary">生产数据</h4>
                            <p class="text-xs text-text-secondary">死淘、耗料、存栏等</p>
                        </div>
                    </div>
                </div>

                <div id="diagnosis-data-card" class="bg-card-bg rounded-xl p-4 shadow-card card-hover">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-secondary/10 rounded-full flex items-center justify-center">
                            <i class="fas fa-stethoscope text-xl text-secondary"></i>
                        </div>
                        <div>
                            <h4 class="font-semibold text-text-primary">诊断数据</h4>
                            <p class="text-xs text-text-secondary">AI诊断记录</p>
                        </div>
                    </div>
                </div>

                <div id="customer-data-card" class="bg-card-bg rounded-xl p-4 shadow-card card-hover">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-secondary/10 rounded-full flex items-center justify-center">
                            <i class="fas fa-users text-xl text-secondary"></i>
                        </div>
                        <div>
                            <h4 class="font-semibold text-text-primary">客户数据</h4>
                            <p class="text-xs text-text-secondary">客户档案、互动记录</p>
                        </div>
                    </div>
                </div>

                <div id="internship-data-card" class="bg-card-bg rounded-xl p-4 shadow-card card-hover">
                    <div class="flex items-center space-x-3">
                        <div class="w-12 h-12 bg-secondary/10 rounded-full flex items-center justify-center">
                            <i class="fas fa-graduation-cap text-xl text-secondary"></i>
                        </div>
                        <div>
                            <h4 class="font-semibold text-text-primary">实习数据</h4>
                            <p class="text-xs text-text-secondary">实习日志、报告</p>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- 时间范围选择 -->
        <section id="time-range" class="mb-8">
            <h2 id="time-range-title" class="text-lg font-semibold text-text-primary mb-4">选择时间范围</h2>
            
            <div id="time-range-card" class="bg-card-bg rounded-xl p-4 shadow-card">
                <div class="flex flex-col space-y-4">
                    <div class="flex items-center justify-between">
                        <label for="start-date" class="text-text-primary font-medium">开始日期</label>
                        <input type="date" id="start-date" class="bg-gray-100 rounded-lg px-3 py-2 text-text-primary">
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <label for="end-date" class="text-text-primary font-medium">结束日期</label>
                        <input type="date" id="end-date" class="bg-gray-100 rounded-lg px-3 py-2 text-text-primary">
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <label for="export-format" class="text-text-primary font-medium">导出格式</label>
                        <select id="export-format" class="bg-gray-100 rounded-lg px-3 py-2 text-text-primary">
                            <option value="excel">Excel (.xlsx)</option>
                            <option value="csv">CSV (.csv)</option>
                        </select>
                    </div>
                </div>
            </div>
        </section>

        <!-- 导出按钮 -->
        <section id="export-button" class="mb-8">
            <button id="export-btn" class="w-full bg-secondary text-accent font-semibold py-3 rounded-xl shadow-button">
                导出数据
            </button>
        </section>

        <!-- 导出历史记录 -->
        <section id="export-history">
            <h2 id="export-history-title" class="text-lg font-semibold text-text-primary mb-4">导出历史</h2>
            
            <div id="history-list" class="space-y-3">
                <div id="history-item-1" class="bg-card-bg rounded-xl p-4 shadow-card">
                    <div class="flex items-center justify-between">
                        <div>
                            <h4 id="history-title-1" class="font-semibold text-text-primary">生产数据_20240101-20240115</h4>
                            <p id="history-time-1" class="text-xs text-text-secondary">2024-01-15 14:30</p>
                        </div>
                        <button id="download-btn-1" class="text-secondary font-medium">
                            <i class="fas fa-download mr-1"></i> 下载
                        </button>
                    </div>
                </div>

                <div id="history-item-2" class="bg-card-bg rounded-xl p-4 shadow-card">
                    <div class="flex items-center justify-between">
                        <div>
                            <h4 id="history-title-2" class="font-semibold text-text-primary">诊断数据_20240101-20240115</h4>
                            <p id="history-time-2" class="text-xs text-text-secondary">2024-01-15 10:20</p>
                        </div>
                        <button id="download-btn-2" class="text-secondary font-medium">
                            <i class="fas fa-download mr-1"></i> 下载
                        </button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 底部导航栏 -->
    <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 flex justify-around items-center h-16 px-2 safe-bottom z-40">
        <a id="nav-home" href="P-HOME_FARMER_ENTERPRISE.html" class="flex flex-col items-center p-2">
            <i class="fas fa-home text-xl"></i>
            <span class="text-xs mt-0.5">首页</span>
        </a>
        <a id="nav-production" href="P-PRODUCTION_DASHBOARD.html" class="flex flex-col items-center p-2">
            <i class="fas fa-chart-bar text-xl"></i>
            <span class="text-xs mt-0.5">生产管理</span>
        </a>
        <a id="nav-profile" href="P-USER_PROFILE.html" class="flex flex-col items-center p-2">
            <i class="fas fa-user text-xl"></i>
            <span class="text-xs mt-0.5">我的</span>
        </a>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 动态设置底部导航栏激活状态
            function setActiveNavItem() {
                const currentUrl = window.location.href;
                const navItems = document.querySelectorAll('#bottom-nav a');
                
                navItems.forEach(item => {
                    const href = item.getAttribute('href');
                    if (currentUrl.includes(href)) {
                        item.classList.add('text-secondary');
                        item.classList.remove('text-text-secondary');
                    } else {
                        item.classList.add('text-text-secondary');
                        item.classList.remove('text-secondary');
                    }
                });
            }
            
            // 初始化导航栏激活状态
            setActiveNavItem();
            
            // 返回按钮点击事件
            document.querySelector('#back-btn').addEventListener('click', function() {
                window.history.back();
            });
            
            // 导出数据按钮点击事件
            document.querySelector('#export-btn').addEventListener('click', function() {
                // 模拟导出数据
                console.log('导出数据');
                // 显示导出成功提示
                alert('数据导出成功，请到导出历史查看下载链接');
            });
            
            // 导出类型卡片点击事件
            document.querySelector('#production-data-card').addEventListener('click', function() {
                console.log('选择生产数据导出');
            });
            
            document.querySelector('#diagnosis-data-card').addEventListener('click', function() {
                console.log('选择诊断数据导出');
            });
            
            document.querySelector('#customer-data-card').addEventListener('click', function() {
                console.log('选择客户数据导出');
            });
            
            document.querySelector('#internship-data-card').addEventListener('click', function() {
                console.log('选择实习数据导出');
            });
            
            // 下载历史记录按钮点击事件
            document.querySelector('#download-btn-1').addEventListener('click', function() {
                console.log('下载历史记录 1');
            });
            
            document.querySelector('#download-btn-2').addEventListener('click', function() {
                console.log('下载历史记录 2');
            });
            
            // 卡片点击效果
            const cards = document.querySelectorAll('.card-hover');
            cards.forEach(card => {
                card.addEventListener('touchstart', function() {
                    this.style.transform = 'scale(0.98)';
                });
                card.addEventListener('touchend', function() {
                    this.style.transform = 'scale(1)';
                });
            });
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>禽康智检 - 科研院所首页</title>
    <script src="https://unpkg.byted-static.com/coze/space_ppt_lib/1.0.3-alpha.12/lib/tailwindcss.js"></script>
    <script src="https://unpkg.byted-static.com/fortawesome/fontawesome-free/6.7.2/js/all.min.js" data-auto-replace-svg="nest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                primary: '#E6F7F3',
                secondary: '#2DBBA1',
                accent: '#1F5E52',
                'text-primary': '#111827',
                'text-secondary': '#4B5563',
                'text-tertiary': '#9CA3AF',
                'bg-light': '#F3F4F6',
                'card-bg': '#FFFFFF',
                'border-color': '#E5E7EB',
                'success': '#10B981',
                'warning': '#F59E0B',
                'error': '#EF4444',
                'info': '#3B82F6'
            },
            
            
                    fontFamily: {
                        'sans': ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
                    },
                    boxShadow: {
                        'card': '0 2px 8px rgba(0, 0, 0, 0.06)',
                        'button': '0 2px 4px rgba(59, 204, 165, 0.2)'
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #E6F7F3 0%, #2DBBA1 100%);
        }
        
        .card-hover:active {
            transform: scale(0.98);
            transition: transform 0.1s ease;
        }
        
        .safe-top {
            padding-top: env(safe-area-inset-top);
        }
        
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .status-bar {
            background: linear-gradient(135deg, #E6F7F3 0%, #2DBBA1 100%);
        }
    </style>
</head>
<body class="bg-bg-light font-sans">
    <!-- 状态栏 -->
    <div id="status-bar" class="status-bar safe-top">
        <div class="flex justify-between items-center px-4 py-2 text-sm font-medium text-accent">
            <span>9:41</span>
            <div class="flex items-center space-x-1">
                <i class="fas fa-signal text-xs"></i>
                <i class="fas fa-wifi text-xs"></i>
                <i class="fas fa-battery-three-quarters text-xs"></i>
            </div>
        </div>
    </div>

    <!-- 顶部导航栏 -->
    <header id="top-header" class="bg-white shadow-sm">
        <div class="flex justify-between items-center px-4 py-3">
            <div class="flex items-center space-x-3">
                <h1 id="page-title" class="text-lg font-semibold text-text-primary">科研院所首页</h1>
            </div>
            <div id="header-actions" class="flex items-center space-x-3">
                <button id="notification-btn" class="relative p-2">
                    <i class="far fa-bell text-xl text-text-secondary"></i>
                    <span class="absolute -top-1 -right-1 w-3 h-3 bg-red-500 rounded-full"></span>
                </button>
                <button id="profile-btn">
                    <i class="fas fa-user-circle text-xl text-text-secondary"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 主要内容区域 -->
    <main id="main-content" class="px-4 py-6">
        <!-- 数据概览 -->
        <section id="overview-section" class="grid grid-cols-3 gap-4 mb-6">
            <div id="annotated-cases-count" class="bg-card-bg rounded-xl p-4 shadow-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-text-secondary">已标注病例</p>
                        <h3 class="text-2xl font-bold text-text-primary mt-1">234</h3>
                    </div>
                    <div class="w-12 h-12 bg-secondary/10 rounded-full flex items-center justify-center">
                        <i class="fas fa-pen-fancy text-xl text-secondary"></i>
                    </div>
                </div>
            </div>
            
            <div id="research-groups-count" class="bg-card-bg rounded-xl p-4 shadow-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-text-secondary">科研群组</p>
                        <h3 class="text-2xl font-bold text-text-primary mt-1">8</h3>
                    </div>
                    <div class="w-12 h-12 bg-secondary/10 rounded-full flex items-center justify-center">
                        <i class="fas fa-users text-xl text-secondary"></i>
                    </div>
                </div>
            </div>
            
            <div id="collaboration-requests-count" class="bg-card-bg rounded-xl p-4 shadow-card">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-text-secondary">协作请求</p>
                        <h3 class="text-2xl font-bold text-text-primary mt-1">3</h3>
                    </div>
                    <div class="w-12 h-12 bg-secondary/10 rounded-full flex items-center justify-center">
                        <i class="fas fa-envelope text-xl text-secondary"></i>
                    </div>
                </div>
            </div>
        </section>

        <!-- 核心功能区 -->
        <section id="core-functions" class="space-y-4 mb-6">
            <button id="data-annotation-btn" class="w-full gradient-bg rounded-xl p-4 shadow-card flex items-center justify-center space-x-3 card-hover">
                <div class="w-12 h-12 bg-white/30 rounded-full flex items-center justify-center">
                    <i class="fas fa-microscope text-accent"></i>
                </div>
                <div class="text-left">
                    <h3 class="font-semibold text-accent">数据标注</h3>
                    <p class="text-sm text-accent/80">标注和管理病例数据</p>
                </div>
            </button>
            
            <div class="flex space-x-4">
                <button id="case-collection-btn" class="flex-1 gradient-bg rounded-xl p-4 shadow-card flex items-center justify-center space-x-3 card-hover">
                    <div class="w-12 h-12 bg-white/30 rounded-full flex items-center justify-center">
                        <i class="fas fa-database text-accent"></i>
                    </div>
                    <div class="text-left">
                        <h3 class="font-semibold text-accent">病例采集</h3>
                        <p class="text-sm text-accent/80">采集特殊病例数据</p>
                    </div>
                </button>
                
                <button id="research-collab-btn" class="flex-1 gradient-bg rounded-xl p-4 shadow-card flex items-center justify-center space-x-3 card-hover">
                    <div class="w-12 h-12 bg-white/30 rounded-full flex items-center justify-center">
                        <i class="fas fa-users text-accent"></i>
                    </div>
                    <div class="text-left">
                        <h3 class="font-semibold text-accent">科研协作</h3>
                        <p class="text-sm text-accent/80">管理科研协作群组</p>
                    </div>
                </button>
            </div>
        </section>

        <!-- 最近标注病例 -->
        <section id="recent-annotations" class="bg-card-bg rounded-xl p-4 shadow-card mb-6">
            <h2 class="text-lg font-semibold text-text-primary mb-4">最近标注病例</h2>
            
            <div id="annotations-list" class="space-y-4">
                <div class="flex items-start space-x-3">
                    <img src="https://s.coze.cn/image/Vs9ADzmfxB4/" 
                         alt="病例图片" data-category="动物" class="w-20 h-20 rounded-lg object-cover">
                    <div class="flex-1">
                        <div class="flex justify-between items-center">
                            <h3 class="font-medium text-text-primary">新城疫疑似病例</h3>
                            <span class="px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs">已标注</span>
                        </div>
                        <p class="text-sm text-text-secondary mt-1">AI诊断：新城疫 (95%)</p>
                        <p class="text-xs text-text-secondary mt-1">2小时前标注</p>
                    </div>
                </div>
                
                <div class="flex items-start space-x-3">
                    <img src="https://s.coze.cn/image/JJNM-XZlh0M/" 
                         alt="病例图片" data-category="动物" class="w-20 h-20 rounded-lg object-cover">
                    <div class="flex-1">
                        <div class="flex justify-between items-center">
                            <h3 class="font-medium text-text-primary">禽流感确诊病例</h3>
                            <span class="px-2 py-1 bg-green-100 text-green-700 rounded-full text-xs">已标注</span>
                        </div>
                        <p class="text-sm text-text-secondary mt-1">AI诊断：禽流感 (88%)</p>
                        <p class="text-xs text-text-secondary mt-1">昨天标注</p>
                    </div>
                </div>
                
                <div class="flex items-start space-x-3">
                    <img src="https://s.coze.cn/image/yZnwsiZD5AY/" 
                         alt="病例图片" data-category="动物" class="w-20 h-20 rounded-lg object-cover">
                    <div class="flex-1">
                        <div class="flex justify-between items-center">
                            <h3 class="font-medium text-text-primary">传染性支气管炎</h3>
                            <span class="px-2 py-1 bg-yellow-100 text-yellow-700 rounded-full text-xs">待标注</span>
                        </div>
                        <p class="text-sm text-text-secondary mt-1">AI诊断：传染性支气管炎 (92%)</p>
                        <p class="text-xs text-text-secondary mt-1">昨天标注</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 科研群组 -->
        <section id="research-groups" class="bg-card-bg rounded-xl p-4 shadow-card">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-semibold text-text-primary">科研群组</h2>
                <button id="view-all-groups-btn" class="text-sm text-secondary">
                    查看全部 <i class="fas fa-chevron-right ml-1"></i>
                </button>
            </div>
            
            <div id="groups-list" class="space-y-3">
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-secondary/10 rounded-full flex items-center justify-center">
                            <i class="fas fa-users text-xl text-secondary"></i>
                        </div>
                        <div>
                            <h3 class="font-medium text-text-primary">禽流感研究协作组</h3>
                            <p class="text-xs text-text-secondary">12名成员</p>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-text-secondary"></i>
                </div>
                
                <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                    <div class="flex items-center space-x-3">
                        <div class="w-10 h-10 bg-secondary/10 rounded-full flex items-center justify-center">
                            <i class="fas fa-users text-xl text-secondary"></i>
                        </div>
                        <div>
                            <h3 class="font-medium text-text-primary">多病原混合感染研究</h3>
                            <p class="text-xs text-text-secondary">15名成员</p>
                        </div>
                    </div>
                    <i class="fas fa-chevron-right text-text-secondary"></i>
                </div>
            </div>
        </section>
    </main>

    <!-- 底部导航栏 -->
    <nav id="bottom-nav" class="fixed bottom-0 left-0 right-0 bg-white shadow-md safe-bottom z-50">
        <div class="flex justify-around items-center h-16">
            <button id="nav-home" class="flex flex-col items-center justify-center px-4 py-2">
                <i class="fas fa-home text-secondary text-xl"></i>
                <span class="text-xs text-text-primary mt-1">首页</span>
            </button>
            <button id="nav-data-annotation" class="flex flex-col items-center justify-center px-4 py-2">
                <i class="fas fa-pen-fancy text-text-secondary text-xl"></i>
                <span class="text-xs text-text-primary mt-1">数据标注</span>
            </button>
            <button id="nav-research-collab" class="flex flex-col items-center justify-center px-4 py-2">
                <i class="fas fa-users text-text-secondary text-xl"></i>
                <span class="text-xs text-text-primary mt-1">科研协作</span>
            </button>
            <button id="nav-profile" class="flex flex-col items-center justify-center px-4 py-2">
                <i class="fas fa-user-circle text-text-secondary text-xl"></i>
                <span class="text-xs text-text-primary mt-1">我的</span>
            </button>
        </div>
    </nav>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 个人中心按钮
            document.querySelector('#profile-btn').addEventListener('click', function() {
                window.location.href = 'P-USER_PROFILE.html';
            });
            
            // 数据标注按钮
            document.querySelector('#data-annotation-btn').addEventListener('click', function() {
                window.location.href = 'P-DATA_ANNOTATION.html';
            });
            
            // 病例采集按钮
            document.querySelector('#case-collection-btn').addEventListener('click', function() {
                window.location.href = 'P-DATA_ANNOTATION.html';
            });
            
            // 科研协作按钮
            document.querySelector('#research-collab-btn').addEventListener('click', function() {
                window.location.href = 'P-RESEARCH_COLLAB.html';
            });
            
            // 查看全部群组按钮
            document.querySelector('#view-all-groups-btn').addEventListener('click', function() {
                window.location.href = 'P-RESEARCH_COLLAB.html';
            });
            
            // 底部导航栏
            document.querySelector('#nav-home').addEventListener('click', function() {
                window.location.href = 'P-HOME_INSTITUTION_RESEARCH.html';
            });
            
            document.querySelector('#nav-data-annotation').addEventListener('click', function() {
                window.location.href = 'P-DATA_ANNOTATION.html';
            });
            
            document.querySelector('#nav-research-collab').addEventListener('click', function() {
                window.location.href = 'P-RESEARCH_COLLAB.html';
            });
            
            document.querySelector('#nav-profile').addEventListener('click', function() {
                window.location.href = 'P-USER_PROFILE.html';
            });
        });
    </script>
</body>
</html>

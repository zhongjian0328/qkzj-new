        document.addEventListener('DOMContentLoaded', function() {
            // 返回按钮
            document.querySelector('#back-btn').addEventListener('click', function() {
                window.history.back();
            });

            // 搜索功能
            const searchToggleBtn = document.querySelector('#search-toggle-btn');
            const searchContainer = document.querySelector('#search-container');
            const searchInput = document.querySelector('#search-input');
            const searchClearBtn = document.querySelector('#search-clear-btn');

            searchToggleBtn.addEventListener('click', function() {
                searchContainer.classList.toggle('hidden');
                if (!searchContainer.classList.contains('hidden')) {
                    searchInput.focus();
                }
            });

            searchInput.addEventListener('input', function() {
                if (this.value.length > 0) {
                    searchClearBtn.classList.remove('hidden');
                } else {
                    searchClearBtn.classList.add('hidden');
                }
                filterGraphs(this.value);
            });

            searchClearBtn.addEventListener('click', function() {
                searchInput.value = '';
                this.classList.add('hidden');
                filterGraphs('');
            });

            // 分类筛选
            const categoryBtns = document.querySelectorAll('.category-btn');
            categoryBtns.forEach(btn => {
                btn.addEventListener('click', function() {
                    // 更新分类按钮状态
                    categoryBtns.forEach(b => {
                        b.classList.remove('category-active');
                        b.classList.add('category-inactive');
                    });
                    this.classList.remove('category-inactive');
                    this.classList.add('category-active');

                    // 筛选图谱
                    const category = this.id.replace('category-', '');
                    filterByCategory(category);
                });
            });

            // 图谱项点击
            const graphItems = document.querySelectorAll('.graph-item');
            graphItems.forEach(item => {
                item.addEventListener('click', function() {
                    const diseaseId = this.dataset.diseaseId;
                    showDiseaseDetail(diseaseId);
                });
            });

            // 图谱详情模态框关闭
            const modal = document.querySelector('#graph-detail-modal');
            const modalOverlay = modal.querySelector('.modal-overlay');
            const modalCloseBtn = modal.querySelector('.fa-times').parentElement;

            modalOverlay.addEventListener('click', function() {
                modal.classList.add('hidden');
            });

            modalCloseBtn.addEventListener('click', function() {
                modal.classList.add('hidden');
            });

            // 底部导航栏
            document.querySelector('#nav-home').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'P-HOME_STUDENT_LEARNING.html';
            });

            document.querySelector('#nav-learning').addEventListener('click', function(e) {
                e.preventDefault();
                // 已在学习页面，无需操作
            });

            document.querySelector('#nav-profile').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'P-USER_PROFILE.html';
            });

            // 筛选函数
            function filterGraphs(searchTerm) {
                const graphItems = document.querySelectorAll('.graph-item');
                const activeCategory = document.querySelector('.category-active').id.replace('category-', '');

                graphItems.forEach(item => {
                    const diseaseName = item.querySelector('h3').textContent.toLowerCase();
                    const diseaseCategory = item.dataset.category;
                    
                    const matchesSearch = !searchTerm || diseaseName.includes(searchTerm.toLowerCase());
                    const matchesCategory = activeCategory === 'all' || diseaseCategory === activeCategory;
                    
                    if (matchesSearch && matchesCategory) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
            }

            function filterByCategory(category) {
                const graphItems = document.querySelectorAll('.graph-item');
                const searchTerm = searchInput.value;

                graphItems.forEach(item => {
                    const diseaseCategory = item.dataset.category;
                    const diseaseName = item.querySelector('h3').textContent.toLowerCase();
                    
                    const matchesCategory = category === 'all' || diseaseCategory === category;
                    const matchesSearch = !searchTerm || diseaseName.includes(searchTerm.toLowerCase());
                    
                    if (matchesCategory && matchesSearch) {
                        item.style.display = 'block';
                    } else {
                        item.style.display = 'none';
                    }
                });
            }

            // 显示疾病详情
            function showDiseaseDetail(diseaseId) {
                const disease = diseaseData[diseaseId];
                if (!disease) return;

                // 填充模态框内容
                document.querySelector('#modal-disease-name').textContent = disease.name;
                document.querySelector('#modal-disease-category').textContent = disease.category;
                document.querySelector('#modal-disease-description').textContent = disease.description;

                // 填充图片
                const imagesContainer = document.querySelector('#modal-disease-images');
                imagesContainer.innerHTML = '';
                disease.images.forEach(imgSrc => {
                    const imgElement = document.createElement('img');
                    imgElement.src = imgSrc;
                    imgElement.alt = `${disease.name}病理图`;
                    imgElement.className = 'w-full h-24 object-cover rounded-lg';
                    imgElement.dataset.category = '动物';
                    imagesContainer.appendChild(imgElement);
                });

                // 填充症状
                const symptomsContainer = document.querySelector('#modal-disease-symptoms');
                symptomsContainer.innerHTML = '';
                disease.symptoms.forEach(symptom => {
                    const spanElement = document.createElement('span');
                    spanElement.className = 'px-3 py-1 bg-secondary/10 text-secondary text-xs rounded-full';
                    spanElement.textContent = symptom;
                    symptomsContainer.appendChild(spanElement);
                });

                // 填充相关疾病
                const relatedContainer = document.querySelector('#modal-related-diseases');
                relatedContainer.innerHTML = '';
                disease.relatedDiseases.forEach(relatedDisease => {
                    const divElement = document.createElement('div');
                    divElement.className = 'flex items-center space-x-2 p-2 bg-gray-50 rounded-lg';
                    divElement.innerHTML = `
                        <i class="fas fa-link text-secondary text-sm"></i>
                        <span class="text-sm text-text-primary">${relatedDisease}</span>
                    `;
                    relatedContainer.appendChild(divElement);
                });

                // 显示模态框
                modal.classList.remove('hidden');
            }

            // 卡片点击效果
            const cards = document.querySelectorAll('.card-hover');
            cards.forEach(card => {
                card.addEventListener('touchstart', function() {
                    this.style.transform = 'scale(0.98)';
                });
                card.addEventListener('touchend', function() {
                    this.style.transform = 'scale(1)';
                });
            });
        });
    </script>
</body>
</html>

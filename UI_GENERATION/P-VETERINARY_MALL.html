<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <script src="https://unpkg.byted-static.com/fortawesome/fontawesome-free/6.7.2/js/all.min.js" data-auto-replace-svg="nest"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                primary: '#E6F7F3',
                secondary: '#2DBBA1',
                accent: '#1F5E52',
                'text-primary': '#111827',
                'text-secondary': '#4B5563',
                'text-tertiary': '#9CA3AF',
                'bg-light': '#F3F4F6',
                'card-bg': '#FFFFFF',
                'border-color': '#E5E7EB',
                'success': '#10B981',
                'warning': '#F59E0B',
                'error': '#EF4444',
                'info': '#3B82F6'
            },
            
            
                    fontFamily: {
                        'sans': ['-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
                    },
                    boxShadow: {
                        'card': '0 2px 8px rgba(0, 0, 0, 0.06)',
                        'button': '0 2px 4px rgba(59, 204, 165, 0.2)'
                    }
                }
            }
        }
    </script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #E6F7F3 0%, #2DBBA1 100%);
        }
        
        .card-hover:active {
            transform: scale(0.98);
            transition: transform 0.1s ease;
        }
        
        .safe-top {
            padding-top: env(safe-area-inset-top);
        }
        
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom);
        }
        
        .status-bar {
            background: linear-gradient(135deg, #E6F7F3 0%, #2DBBA1 100%);
        }

        .category-active {
            background-color: #3BCCA5;
            color: white;
        }

        .category-inactive {
            background-color: #F3F4F6;
            color: #6B7280;
        }

        .search-input:focus {
            outline: none;
            border-color: #3BCCA5;
            box-shadow: 0 0 0 2px rgba(59, 204, 165, 0.2);
        }

        .product-card {
            transition: transform 0.2s ease;
        }

        .product-card:active {
            transform: scale(0.98);
        }
    </style>
</head>

                <div class="w-12 h-1 bg-gray-300 rounded-full"></div>
            </div>
            
            <div id="modal-content" class="px-6 pb-6">
                <!-- 商品详情内容将通过JavaScript动态填充 -->
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 解析URL参数的辅助函数
            function getUrlParams() {
                const params = {};
                const queryString = window.location.search.substring(1);
                const urlParams = new URLSearchParams(queryString);
                
                for(const [key, value] of urlParams.entries()) {
                    params[key] = value;
                }
                return params;
            }

            // 获取URL参数并进行搜索
            const params = getUrlParams();
            if(params.keyword) {
                document.querySelector('#search-input').value = params.keyword;
                performSearch(params.keyword);
            }
            if(params.category) {
                selectCategory(params.category);
            }

            // 返回按钮
            document.querySelector('#back-btn').addEventListener('click', function() {
                window.history.back();
            });

            // 购物车按钮
            document.querySelector('#cart-btn').addEventListener('click', function() {
                console.log('跳转到购物车页面');
                // 实际应用中这里会跳转到购物车页面
            });

            // 搜索功能
            document.querySelector('#search-input').addEventListener('input', function() {
                const keyword = this.value.trim();
                if(keyword.length > 0) {
                    performSearch(keyword);
                } else {
                    showAllProducts();
                }
            });

            // 分类选择
            const categoryButtons = document.querySelectorAll('[id^="category-"]');
            categoryButtons.forEach(button => {
                button.addEventListener('click', function() {
                    // 重置所有分类按钮样式
                    categoryButtons.forEach(btn => {
                        btn.classList.remove('category-active');
                        btn.classList.add('category-inactive');
                    });
                    
                    // 激活当前按钮
                    this.classList.remove('category-inactive');
                    this.classList.add('category-active');
                    
                    // 筛选商品
                    const category = this.id.replace('category-', '');
                    filterProductsByCategory(category);
                });
            });

            // 商品卡片点击事件
            const productCards = document.querySelectorAll('.product-card');
            productCards.forEach(card => {
                card.addEventListener('click', function(e) {
                    // 如果点击的是加入购物车按钮，不触发商品详情
                    if(e.target.id.startsWith('add-cart-')) {
                        return;
                    }
                    
                    const productId = this.dataset.productId;
                    showProductDetail(productId);
                });
            });

            // 加入购物车按钮事件
            const addCartButtons = document.querySelectorAll('[id^="add-cart-"]');
            addCartButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    e.stopPropagation(); // 阻止事件冒泡
                    
                    const productId = this.id.replace('add-cart-', '');
                    addToCart(productId);
                });
            });

            // 底部导航栏
            document.querySelector('#nav-home').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'P-HOME_FARMER_SMALL.html';
            });

            document.querySelector('#nav-diagnosis').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'P-AI_DIAGNOSIS_MODE_SELECT.html';
            });

            document.querySelector('#nav-mall').addEventListener('click', function(e) {
                e.preventDefault();
                // 已在商城页面，无需操作
            });

            document.querySelector('#nav-profile').addEventListener('click', function(e) {
                e.preventDefault();
                window.location.href = 'P-USER_PROFILE.html';
            });

            // 商品详情模态框关闭
            document.querySelector('#product-modal').addEventListener('click', function(e) {
                if(e.target === this) {
                    this.classList.add('hidden');
                }
            });

            // 搜索功能实现
            function performSearch(keyword) {
                const productCards = document.querySelectorAll('.product-card');
                productCards.forEach(card => {
                    const productName = card.querySelector('[id^="product-name-"]').textContent.toLowerCase();
                    if(productName.includes(keyword.toLowerCase())) {
                        card.style.display = 'block';
                    } else {
                        card.style.display = 'none';
                    }
                });
            }

            // 显示所有商品
            function showAllProducts() {
                const productCards = document.querySelectorAll('.product-card');
                productCards.forEach(card => {
                    card.style.display = 'block';
                });
            }

            // 按分类筛选商品
            function filterProductsByCategory(category) {
                const productCards = document.querySelectorAll('.product-card');
                productCards.forEach(card => {
                    if(category === 'all') {
                        card.style.display = 'block';
                    } else {
                        const cardCategory = card.dataset.category;
                        if(cardCategory === category) {
                            card.style.display = 'block';
                        } else {
                            card.style.display = 'none';
                        }
                    }
                });
            }

            // 选择指定分类
            function selectCategory(category) {
                const categoryButton = document.querySelector(`#category-${category}`);
                if(categoryButton) {
                    categoryButton.click();
                }
            }

            // 显示商品详情
            function showProductDetail(productId) {
                const productData = getProductData(productId);
                if(!productData) return;

                const modalContent = document.querySelector('#modal-content');
                modalContent.innerHTML = `
                    <div class="flex justify-between items-start mb-4">
                        <h2 class="text-xl font-bold text-text-primary">${productData.name}</h2>
                        <button id="close-modal" class="p-2">
                            <i class="fas fa-times text-xl text-text-secondary"></i>
                        </button>
                    </div>
                    
                    <div class="mb-4">
                        <img src="${productData.image}" alt="${productData.name}" class="w-full h-48 object-cover rounded-lg">
                    </div>
                    
                    <div class="mb-4">
                        <div class="flex items-center space-x-2 mb-2">
                            <span class="text-2xl font-bold text-red-500">¥${productData.price}</span>
                            ${productData.originalPrice ? `<span class="text-lg text-text-secondary line-through">¥${productData.originalPrice}</span>` : ''}
                        </div>
                        <div class="flex items-center space-x-4 text-sm text-text-secondary">
                            <span>销量：${productData.sales}</span>
                            <div class="flex items-center">
                                <i class="fas fa-star text-yellow-400 mr-1"></i>
                                <span>${productData.rating}</span>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mb-6">
                        <h3 class="font-semibold text-text-primary mb-2">商品详情</h3>
                        <p class="text-sm text-text-secondary leading-relaxed">
                            ${productData.description}
                        </p>
                    </div>
                    
                    <div class="flex space-x-3">
                        <button id="modal-add-cart" class="flex-1 py-3 bg-secondary text-white text-sm rounded-lg font-medium">
                            加入购物车
                        </button>
                        <button id="modal-buy-now" class="flex-1 py-3 bg-red-500 text-white text-sm rounded-lg font-medium">
                            立即购买
                        </button>
                    </div>
                `;

                // 绑定模态框内按钮事件
                document.querySelector('#close-modal').addEventListener('click', function() {
                    document.querySelector('#product-modal').classList.add('hidden');
                });

                document.querySelector('#modal-add-cart').addEventListener('click', function() {
                    addToCart(productId);
                    document.querySelector('#product-modal').classList.add('hidden');
                });

                document.querySelector('#modal-buy-now').addEventListener('click', function() {
                    buyNow(productId);
                    document.querySelector('#product-modal').classList.add('hidden');
                });

                document.querySelector('#product-modal').classList.remove('hidden');
            }

            // 加入购物车
            function addToCart(productId) {
                const productData = getProductData(productId);
                if(!productData) return;

                // 更新购物车数量
                const cartCountElement = document.querySelector('#cart-count');
                let currentCount = parseInt(cartCountElement.textContent);
                cartCountElement.textContent = currentCount + 1;

                // 显示成功提示
                showToast('已加入购物车');

                console.log('加入购物车:', productData.name);
            }

            // 立即购买
